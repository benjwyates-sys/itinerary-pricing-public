[project]
name = "itinerary-pricing"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["openpyxl>=3.1", "pillow>=10.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pricing"]
